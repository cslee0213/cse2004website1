<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christine's Class-Survey</title>
</head>
<body>
<h1>Do you have VS Code or another text editor installed?</h1>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<canvas id="myChart" width="400" height="200"></canvas>

<script>
  const ctx = document.getElementById('myChart')

  new Chart(ctx, {
    type: 'pie',
    data: {
      labels: ['Yes', 'No'],
      datasets: [{
        label: 'Do you have Node.js installed?',
        data: [47, 6],
      }]
    }
  })
</script>

</body>
</html>
